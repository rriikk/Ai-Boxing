<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Boxing Game</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    #ui {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        text-align: center;
        z-index: 10;
    }

    .bar {
        width: 200px;
        height: 20px;
        border: 2px solid white;
        margin: 5px auto;
    }

    .hp {
        height: 100%;
        background: red;
        width: 100%;
    }

    #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
    }

    button {
        font-size: 18px;
        padding: 10px 20px;
        margin: 5px;
        border-radius: 10px;
        border: none;
        background: orange;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="ui">
    <div>PLAYER</div>
    <div class="bar"><div id="playerHP" class="hp"></div></div>
    <div>ENEMY</div>
    <div class="bar"><div id="enemyHP" class="hp"></div></div>
</div>

<div id="controls">
    <button onclick="punch('left')">👊 Left</button>
    <button onclick="punch('right')">🤜 Right</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { FBXLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js";

let scene, camera, renderer;
let player, enemy;
let playerHP = 100;
let enemyHP = 100;

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 3, 8);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // Ring floor
    const floor = new THREE.Mesh(
        new THREE.BoxGeometry(10, 0.5, 10),
        new THREE.MeshStandardMaterial({ color: 0x444444 })
    );
    floor.position.y = -0.25;
    scene.add(floor);

    loadBoxers();

    window.addEventListener("resize", onResize);
}

function loadBoxers() {
    const loader = new FBXLoader();

    loader.load("Boxing (1).fbx", fbx => {
        player = fbx;
        player.scale.set(0.02, 0.02, 0.02);
        player.position.set(-1.5, 0, 0);
        scene.add(player);

        enemy = fbx.clone();
        enemy.scale.set(0.02, 0.02, 0.02);
        enemy.position.set(1.5, 0, 0);
        enemy.rotation.y = Math.PI;
        scene.add(enemy);

        enemyAI();
    });
}

function punch(type) {
    if (!enemy) return;

    enemyHP -= 10;
    updateHP();

    enemy.position.x += 0.1;
    setTimeout(() => enemy.position.x -= 0.1, 100);
}

function enemyAI() {
    setInterval(() => {
        if (!player || enemyHP <= 0) return;

        playerHP -= 5;
        updateHP();

        player.position.x -= 0.1;
        setTimeout(() => player.position.x += 0.1, 100);
    }, 1500);
}

function updateHP() {
    document.getElementById("playerHP").style.width = playerHP + "%";
    document.getElementById("enemyHP").style.width = enemyHP + "%";

    if (enemyHP <= 0) alert("🥊 YOU WIN!");
    if (playerHP <= 0) alert("💀 YOU LOSE!");
}

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>

</body>
</html>
